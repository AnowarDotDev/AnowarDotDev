name: update stats

# Third-party card services can only see public commits, which is ~7% of the
# real number here. This regenerates the README stats block with our own PAT.
on:
  schedule:
    - cron: '20 3 * * *' # daily, 03:20 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-stats.mjs
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Regenerate stats
        # No secret required. STATS_TOKEN is optional and only widens what is
        # visible: without it the repo/language block is skipped rather than
        # rewritten with public-only data. If you add one, a fine-grained PAT
        # with Metadata:Read-only over all repositories is enough — the classic
        # `repo` scope grants far more write access than this needs.
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          STATS_LOGIN: ${{ github.repository_owner }}
        run: node scripts/build-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No stats change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile stats"
          git push
